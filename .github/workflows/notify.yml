name: notify
# @mention from the bot so GitHub emails Tom about pipeline-opened PRs
# (GitHub never notifies you of your own actions).
on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, ready_for_review]
permissions:
  issues: write
  pull-requests: write
jobs:
  ping:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: '@tdesmedt-tdsgn 📬 ready for you — replying to this notification email works.'
            });
